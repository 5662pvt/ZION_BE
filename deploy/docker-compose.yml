name: zionshop

services:
  postgres:
    image: postgres:16-alpine
    container_name: zionshop-postgres
    environment:
      POSTGRES_DB: ZionShop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${DB_PASSWORD:-123@123a}"
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ZionShop"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: zionshop-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    container_name: zionshop-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER:-guest}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASS:-guest}"
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10

  seq:
    image: datalust/seq:latest
    container_name: zionshop-seq
    environment:
      ACCEPT_EULA: "Y"
    ports:
      - "8081:80"
      - "5341:5341"
    volumes:
      - seq-data:/data

  # Dev-only OTLP receiver + UI for traces/metrics/logs. DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS
  # disables the dashboard's auth token — fine for local Docker, never for staging/production.
  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:8.2
    container_name: zionshop-aspire-dashboard
    environment:
      DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "18888:18888"
      - "4317:18889"
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: src/Api/ZIONShop.Api/Dockerfile
    container_name: zionshop-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=ZionShop;Username=postgres;Password=${DB_PASSWORD:-123@123a}"
      Jwt__SigningKey: "${JWT_SIGNING_KEY:-docker-only-signing-key-please-rotate-32+chars-zionshop}"
      EventBus__Provider: "RabbitMq"
      EventBus__Host: rabbitmq
      EventBus__User: "${RABBITMQ_USER:-guest}"
      EventBus__Pass: "${RABBITMQ_PASS:-guest}"
      Redis__Configuration: "redis:6379"
      Email__Host: "${EMAIL_HOST:-}"
      Email__Port: "${EMAIL_PORT:-587}"
      Email__UseSsl: "${EMAIL_USE_SSL:-true}"
      Email__UserName: "${EMAIL_USERNAME:-}"
      Email__Password: "${EMAIL_PASSWORD:-}"
      Email__FromAddress: "${EMAIL_FROM_ADDRESS:-noreply@zionshop.local}"
      Email__FromName: "${EMAIL_FROM_NAME:-ZIONShop}"
      Serilog__WriteTo__1__Name: Seq
      Serilog__WriteTo__1__Args__serverUrl: "http://seq:5341"
      Cors__AllowedOrigins__0: "http://localhost:5173"
      Cors__AllowedOrigins__1: "http://localhost"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://aspire-dashboard:18889"
      OTEL_SERVICE_NAME: "zionshop-api"
      # Consumers/outbox publishers/scan jobs run on the separate `worker` service instead -- keeping
      # both on would double-process the same outbox rows/queues (at-least-once delivery tolerates
      # it, but it's wasted work and noisier traces for no benefit).
      BackgroundProcessing__Enabled: "false"
    ports:
      - "8080:8080"
    volumes:
      - api-uploads:/app/App_Data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      aspire-dashboard:
        condition: service_started

  worker:
    build:
      context: ..
      dockerfile: src/Worker/ZIONShop.Worker/Dockerfile
    container_name: zionshop-worker
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=ZionShop;Username=postgres;Password=${DB_PASSWORD:-123@123a}"
      EventBus__Provider: "RabbitMq"
      EventBus__Host: rabbitmq
      EventBus__User: "${RABBITMQ_USER:-guest}"
      EventBus__Pass: "${RABBITMQ_PASS:-guest}"
      Redis__Configuration: "redis:6379"
      Email__Host: "${EMAIL_HOST:-}"
      Email__Port: "${EMAIL_PORT:-587}"
      Email__UseSsl: "${EMAIL_USE_SSL:-true}"
      Email__UserName: "${EMAIL_USERNAME:-}"
      Email__Password: "${EMAIL_PASSWORD:-}"
      Email__FromAddress: "${EMAIL_FROM_ADDRESS:-noreply@zionshop.local}"
      Email__FromName: "${EMAIL_FROM_NAME:-ZIONShop}"
      Serilog__WriteTo__1__Name: Seq
      Serilog__WriteTo__1__Args__serverUrl: "http://seq:5341"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://aspire-dashboard:18889"
      OTEL_SERVICE_NAME: "zionshop-worker"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      aspire-dashboard:
        condition: service_started
      api:
        condition: service_started

  nginx:
    image: nginx:1.27-alpine
    container_name: zionshop-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api

volumes:
  postgres-data:
  seq-data:
  api-uploads:
